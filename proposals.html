<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partner Portal | Partnerships</title>
    <link rel="stylesheet" href="ppsearch.css">
    <link rel="stylesheet" href="proposals.css">
    <link rel="stylesheet" href="shared.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">PartnerPortal</a>
        <div class="bx bx-menu" id="menu-icon"></div>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="onboarding.html">Onboarding</a>
            <a href="ppsearch.html">Search</a>
            <a href="proposals.html" class="active">Partnerships</a>
            <a href="ppdashboard.html">Dashboard</a>
            <a href="pplogin.html">Login</a>
        </nav>
    </header>

    <section class="search-section">
        <div class="section-header">
            <h2>Your <span>Partnerships</span></h2>
            <div class="underline"></div>
        </div>

        <div class="search-container">
            <div class="proposal-tabs" role="tablist">
                <button class="proposal-tab active" data-tab="incoming" role="tab">
                    Needs your response <span class="tab-count" id="countIncoming">0</span>
                </button>
                <button class="proposal-tab" data-tab="outgoing" role="tab">
                    Sent <span class="tab-count" id="countOutgoing">0</span>
                </button>
                <button class="proposal-tab" data-tab="agreed" role="tab">
                    Agreed <span class="tab-count" id="countAgreed">0</span>
                </button>
                <button class="proposal-tab" data-tab="closed" role="tab">
                    Closed
                </button>
            </div>

            <div id="proposalList" class="proposal-list"></div>
        </div>
    </section>

    <!-- Respond modal -->
    <div id="respondModal" class="modal">
        <div class="modal-container">
            <div class="modal-header">
                <h2 id="respondTitle">Respond</h2>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <div id="respondTerms" class="respond-terms"></div>
                <form id="respondForm">
                    <div class="form-group">
                        <label for="respondMessage">Add a note (optional)</label>
                        <textarea id="respondMessage" rows="3"
                            placeholder="Anything the other organization should know?"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary" id="respondConfirm">Confirm</button>
                        <button type="button" class="btn-ghost" id="respondCancel">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-bottom">
            <span>&copy; 2026 PartnerPortal</span>
            <span>Built for organizations that lift each other up.</span>
        </div>
    </footer>

    <script src="common.js"></script>
    <script src="proposals.js"></script>
</body>
</html>
