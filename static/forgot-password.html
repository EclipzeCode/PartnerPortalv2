<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Warm the connections to the two third-party origins every page uses,
         before the local stylesheets below start downloading. Both the
         boxicons stylesheet and the font stylesheet are render-blocking
         and are discovered late, at the bottom of this head -- so without
         these the browser pays a DNS lookup plus a TLS handshake to each
         before it can even ask for them. gstatic serves the font files
         themselves and is fetched in CORS mode, which is what crossorigin
         matches; the other two are ordinary stylesheet requests. -->
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Forgot password | PartnerPortal</title>
    <!-- SVG first for anything modern (one file, sharp at every size); the
         .ico is the legacy fallback and is also what a bare /favicon.ico
         request gets. -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="robots" content="noindex, nofollow">
    <!-- Applied before the first stylesheet so the page never paints in one
         theme and then switches. Light is the default: only an explicit
         choice, stored by the toggle in Settings, turns this on -- the system
         preference is deliberately not consulted, because the product ships
         light and a dark OS is not the same thing as asking for a dark app. -->
    <script>
      try {
        if (localStorage.getItem('partnerPortalTheme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) { /* storage disabled; light theme is the right fallback */ }
    </script>
    <!-- The redesign's shared layer, then the stylesheet the six
         single-purpose pages share. This page used to load its own copy of
         that second file; see the header of notice.css. -->
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="ink.css">
    <link rel="stylesheet" href="notice.css">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="nav.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'
          integrity='sha384-42kyIPf7HDYLkGffmxDhSx/3Z/53wGBs3nD6wEFxsbeDc7rMO6mkYbkAcpRsnMU2'
          crossorigin='anonymous'>
    <!-- Instrument Serif for the heading, Space Grotesk for the copy,
         JetBrains Mono for labels. Poppins is no longer used on this page. -->
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<!-- .ink opts this page into the shared redesign in ink.css. -->
<body class="ink">
    <header class="header">
        <a href="index.html" class="logo">PartnerPortal</a>
        <button type="button" class="bx bx-menu" id="menu-icon"
                aria-label="Menu" aria-expanded="false"></button>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="ppsearch.html">Connect</a>
            <a href="ppdashboard.html">Dashboard <span class="nav-badge" id="navProposalBadge" hidden></span></a>
            <!-- Account slot. Both states ship in the markup and share one grid
                 cell (nav.css), so the bar reserves the CTA's width either way and
                 signing in never shifts the links. common.js picks the state. -->
            <div class="nav-account" id="navAccount" data-state="loading">
                <a href="pplogin.html" class="nav-auth-cta">Login <span class="cta-sep">|</span> Create Account</a>
                <div class="account-menu">
                    <button type="button" class="avatar-button" id="accountToggle"
                            aria-haspopup="true" aria-expanded="false" aria-controls="accountDropdown"
                            aria-label="Account menu">
                        <span class="avatar-initials" id="accountInitials" aria-hidden="true"></span>
                        <span class="avatar-label" id="accountLabel"></span>
                    </button>
                    <div class="account-dropdown" id="accountDropdown" hidden>
                        <div class="account-identity">
                            <span class="account-name" id="accountName"></span>
                            <span class="account-email" id="accountEmail"></span>
                        </div>
                        <a href="onboarding.html"><i class='bx bx-edit'></i> Edit profile</a>
                        <a href="settings.html"><i class='bx bx-cog'></i> Settings</a>
                        <button type="button" class="account-signout" id="accountSignOut">
                            <i class='bx bx-log-out'></i> Log out
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="reset-main">
        <div class="reset-page">
            <div class="reset-card" id="resetCard">
                <h1>Forgot your password?</h1>
                <p class="reset-sub">
                    Enter the email you sign in with and we'll send a link to
                    choose a new one.
                </p>

                <p class="form-banner" id="formBanner" hidden></p>

                <form class="reset-form" id="forgotForm" novalidate>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" autocomplete="email" placeholder="you@organization.org">
                        <p class="field-error" id="email-error"></p>
                    </div>
                    <button type="submit" class="btn-primary" id="submitBtn">Send reset link</button>
                </form>

                <a href="pplogin.html" class="reset-back-link">&larr; Back to sign in</a>
            </div>

            <p class="reset-footer">
                <a href="index.html">PartnerPortal</a> &mdash; partnerships where both sides bring something.
            </p>
        </div>
    </main>

    <script src="common.js"></script>
    <script src="notifications.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
