<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password | PartnerPortal</title>
    <!-- SVG first for anything modern (one file, sharp at every size); the
         .ico is the legacy fallback and is also what a bare /favicon.ico
         request gets. -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="password-reset.css">
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="nav.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">PartnerPortal</a>
        <div class="bx bx-menu" id="menu-icon"></div>
        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="ppsearch.html">Search</a>
            <a href="ppdashboard.html">Dashboard <span class="nav-badge" id="navProposalBadge" hidden></span></a>
            <!-- Account slot. Both states ship in the markup and share one grid
                 cell (nav.css), so the bar reserves the CTA's width either way and
                 signing in never shifts the links. common.js picks the state. -->
            <div class="nav-account" id="navAccount" data-state="loading">
                <a href="pplogin.html" class="nav-auth-cta">Login <span class="cta-sep">|</span> Create Account</a>
                <div class="account-menu">
                    <button type="button" class="avatar-button" id="accountToggle"
                            aria-haspopup="true" aria-expanded="false" aria-controls="accountDropdown"
                            aria-label="Account menu">
                        <span class="avatar-initials" id="accountInitials" aria-hidden="true"></span>
                        <span class="avatar-label" id="accountLabel"></span>
                    </button>
                    <div class="account-dropdown" id="accountDropdown" hidden>
                        <div class="account-identity">
                            <span class="account-name" id="accountName"></span>
                            <span class="account-email" id="accountEmail"></span>
                        </div>
                        <a href="onboarding.html"><i class='bx bx-edit'></i> Edit profile</a>
                        <a href="settings.html"><i class='bx bx-cog'></i> Settings</a>
                        <button type="button" class="account-signout" id="accountSignOut">
                            <i class='bx bx-log-out'></i> Log out
                        </button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="reset-main">
        <div class="reset-page">
            <div class="reset-card" id="resetCard">
                <h1>Forgot your password?</h1>
                <p class="reset-sub">
                    Enter the email you sign in with and we'll send a link to
                    choose a new one.
                </p>

                <p class="form-banner" id="formBanner" hidden></p>

                <form class="reset-form" id="forgotForm" novalidate>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" autocomplete="email" placeholder="you@organization.org">
                        <p class="field-error" id="email-error"></p>
                    </div>
                    <button type="submit" class="btn-primary" id="submitBtn">Send reset link</button>
                </form>

                <a href="pplogin.html" class="reset-back-link">&larr; Back to sign in</a>
            </div>

            <p class="reset-footer">
                <a href="index.html">PartnerPortal</a> &mdash; partnerships where both sides bring something.
            </p>
        </div>
    </main>

    <script src="common.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
