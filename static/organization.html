<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Warm the connections to the two third-party origins every page uses,
         before the local stylesheets below start downloading. Both the
         boxicons stylesheet and the font stylesheet are render-blocking
         and are discovered late, at the bottom of this head -- so without
         these the browser pays a DNS lookup plus a TLS handshake to each
         before it can even ask for them. gstatic serves the font files
         themselves and is fetched in CORS mode, which is what crossorigin
         matches; the other two are ordinary stylesheet requests. -->
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Organization | PartnerPortal</title>
    <!-- SVG first for anything modern (one file, sharp at every size); the
         .ico is the legacy fallback and is also what a bare /favicon.ico
         request gets. -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <!-- Public page: no account needed.
         noindex for now, matching partnership.html. These profiles describe
         real organizations that have not opted into being search-indexed;
         letting crawlers in is a one-word change here once that is a decision
         someone has actually made. -->
    <meta name="robots" content="noindex, nofollow">
    <!-- app.py's organization_page() route stamps og:/twitter: tags here
         before this file is served, so a link pasted into Slack, iMessage or
         Twitter gets a real preview -- those crawlers never run
         organization.js, so anything the preview needs has to already be in
         the markup they fetch. -->
    <!-- og:meta -->
    <!-- Applied before the first stylesheet so the page never paints in one
         theme and then switches. Light is the default: only an explicit
         choice, stored by the toggle in Settings, turns this on -- the system
         preference is deliberately not consulted, because the product ships
         light and a dark OS is not the same thing as asking for a dark app. -->
    <script>
      try {
        if (localStorage.getItem('partnerPortalTheme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) { /* storage disabled; light theme is the right fallback */ }
    </script>
    <link rel="stylesheet" href="tokens.css">
    <!-- The redesign's shared layer, for the palette and the three typefaces.
         This page loads no other shared stylesheet: it carries no navigation,
         no form controls and no modals. -->
    <link rel="stylesheet" href="ink.css">
    <link rel="stylesheet" href="organization.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Instrument Serif for the organization's name, Space Grotesk for what
         they wrote, JetBrains Mono for labels and readings. -->
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<!-- .ink opts this page into the shared redesign in ink.css. -->
<body class="ink">
    <main class="org-page">
        <p class="org-masthead">Organization profile</p>

        <div class="org-card" id="orgCard">
            <p class="loading">Loading profile&hellip;</p>
        </div>

        <p class="org-footer">
            <a href="index.html">PartnerPortal</a> &mdash; partnerships where both sides bring something.
        </p>
    </main>

    <script src="organization.js"></script>
</body>
</html>
