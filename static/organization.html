<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Warm the connections to the two third-party origins every page uses,
         before the local stylesheets below start downloading. Both the
         boxicons stylesheet and the Poppins stylesheet are render-blocking
         and are discovered late, at the bottom of this head -- so without
         these the browser pays a DNS lookup plus a TLS handshake to each
         before it can even ask for them. gstatic serves the font files
         themselves and is fetched in CORS mode, which is what crossorigin
         matches; the other two are ordinary stylesheet requests. -->
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Organization | PartnerPortal</title>
    <!-- SVG first for anything modern (one file, sharp at every size); the
         .ico is the legacy fallback and is also what a bare /favicon.ico
         request gets. -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <!-- Public page: no account needed.
         noindex for now, matching partnership.html. These profiles describe
         real organizations that have not opted into being search-indexed;
         letting crawlers in is a one-word change here once that is a decision
         someone has actually made. -->
    <meta name="robots" content="noindex, nofollow">
    <!-- app.py's organization_page() route stamps og:/twitter: tags here
         before this file is served, so a link pasted into Slack, iMessage or
         Twitter gets a real preview -- those crawlers never run
         organization.js, so anything the preview needs has to already be in
         the markup they fetch. -->
    <!-- og:meta -->
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="organization.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="org-page">
        <div class="org-card" id="orgCard">
            <p class="loading">Loading profile...</p>
        </div>

        <p class="org-footer">
            <a href="index.html">PartnerPortal</a> &mdash; partnerships where both sides bring something.
        </p>
    </main>

    <script src="organization.js"></script>
</body>
</html>
