<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Every stylesheet and font on this page is served from here.
         The Google Fonts and unpkg <link>s that used to sit at the end
         of this head, and the three preconnects that existed to warm
         them, are gone -- see fonts.css and boxicons.css. -->
    <title>Claim your profile | PartnerPortal</title>
    <!-- SVG first for anything modern (one file, sharp at every size); the
         .ico is the legacy fallback and is also what a bare /favicon.ico
         request gets. -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <!-- Public page: reached from an emailed link, no session guaranteed. -->
    <meta name="robots" content="noindex, nofollow">
    <!-- Applied before the first stylesheet so the page never paints in one
         theme and then switches. Three states: an explicit choice stored by
         the control in Settings wins, and with nothing stored the operating
         system decides.

         This resolves to a real answer and always sets the attribute, rather
         than leaving the light case unset and letting a prefers-color-scheme
         block in the CSS carry it. There are seven dark rules across five
         stylesheets, two of them inside print blocks that are load-bearing on
         specificity -- a parallel copy of each under a media query is the
         version of this that silently rots when one of them is edited and its
         twin is not. Resolving here means every one of those rules stays an
         ordinary [data-theme="dark"] match and none of them had to change.

         The listener keeps a system choice honest if the OS flips while the
         page is open; an explicit choice ignores it. -->
    <script>
      (function () {
        var mq = window.matchMedia
          && window.matchMedia('(prefers-color-scheme: dark)');
        function chosen() {
          try {
            var v = localStorage.getItem('partnerPortalTheme');
            return v === 'dark' || v === 'light' ? v : null;
          } catch (e) {
            return null; /* storage disabled; the OS still gets a say */
          }
        }
        function apply() {
          document.documentElement.setAttribute(
            'data-theme', chosen() || (mq && mq.matches ? 'dark' : 'light'));
        }
        apply();
        if (mq && mq.addEventListener) {
          mq.addEventListener('change', function () { if (!chosen()) apply(); });
        }
      })();
    </script>
    <!-- Same shared layer and single-purpose-page stylesheet the reset and
         verification pages use; a claim is the same shape of errand. -->
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="ink.css">
    <link rel="stylesheet" href="notice.css">
    <link rel="stylesheet" href="boxicons.css">
    <!-- Instrument Serif for the heading, Space Grotesk for the copy,
         JetBrains Mono for labels. Poppins is no longer used on this page. -->
    <link rel="stylesheet" href="fonts.css">
</head>
<!-- .ink opts this page into the shared redesign in ink.css. -->
<body class="ink">
    <main class="reset-main">
        <div class="reset-page">
            <!-- role="status" because JavaScript replaces this card's contents
                 with the outcome -- verified, expired, reset. The swap is
                 the entire feedback this page gives, and unannounced it is
                 a page that silently becomes a different page. -->
            <div class="reset-card" id="claimCard" role="status">
                <!-- Populated by claim.js: it has to resolve the token before
                     it knows whose invitation this is, and a form asking
                     somebody to join is worth nothing without that name. -->
            </div>

            <p class="reset-footer">
                <a href="index.html">PartnerPortal</a> &mdash; partnerships where both sides bring something.
            </p>
        </div>
    </main>

    <script src="csrf.js"></script>

    <script src="password-field.js"></script>
    <script src="claim.js"></script>
</body>
</html>
