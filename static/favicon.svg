<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PartnerPortal">
  <!-- The site's own symbol for a two-way match (the bx-transfer arrows worn
       by mutual-match badges), which is the product's whole premise.
       Deliberately heavier than the UI version of the same glyph: this is
       read at 16px more often than anywhere else, where a 2px shaft and a
       tapering head antialias into an unreadable smudge. Shafts are 5 units
       thick and the heads overhang them by 3.5 on each side, so both survive
       being halved. -->
  <rect width="32" height="32" rx="7" fill="#4361ee"/>
  <path d="M6 7.5 H17 V4 L27 10 L17 16 V12.5 H6 Z" fill="#fff"/>
  <path d="M26 19.5 H15 V16 L5 22 L15 28 V24.5 H26 Z" fill="#fff"/>
</svg>
