<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Every stylesheet and font on this page is served from here.
         The Google Fonts and unpkg <link>s that used to sit at the end
         of this head, and the three preconnects that existed to warm
         them, are gone -- see fonts.css and boxicons.css. -->
    <title>Reset password | PartnerPortal</title>
    <!-- SVG first for anything modern (one file, sharp at every size); the
         .ico is the legacy fallback and is also what a bare /favicon.ico
         request gets. -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <!-- Public page: reached from an emailed link, no session guaranteed. -->
    <meta name="robots" content="noindex, nofollow">
    <!-- Applied before the first stylesheet so the page never paints in one
         theme and then switches. Light unless this browser chose otherwise in
         Settings: 'dark', or 'system' to follow the device. The listener keeps
         'system' honest if the OS flips while the page is open. -->
    <script>
      (function () {
        var mq = window.matchMedia
          && window.matchMedia('(prefers-color-scheme: dark)');
        function chosen() {
          try {
            return localStorage.getItem('partnerPortalTheme');
          } catch (e) {
            return null; /* storage disabled; light */
          }
        }
        function apply() {
          var v = chosen();
          document.documentElement.setAttribute('data-theme',
            v === 'dark' || (v === 'system' && mq && mq.matches)
              ? 'dark' : 'light');
        }
        apply();
        if (mq && mq.addEventListener) {
          mq.addEventListener('change', function () {
            if (chosen() === 'system') apply();
          });
        }
      })();
    </script>
    <!-- The redesign's shared layer, then the stylesheet the six
         single-purpose pages share. This page used to load its own copy of
         that second file; see the header of notice.css. -->
    <!-- The four Latin faces every page paints with, fetched from the head
         rather than discovered after the stylesheet bundle has downloaded
         and been parsed. fonts.css is the last sheet in the bundle, so
         without this the hero serif and the mono labels arrived a full
         round trip after the layout did and swapped in over the fallback.
         crossorigin because font fetches are always CORS-mode; a preload
         without it is a different request the browser will not reuse. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/instrumentserif-1dee6305.woff2">
    <link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/instrumentserif-c6f79bf3.woff2">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="ink.css">
    <link rel="stylesheet" href="notice.css">
    <link rel="stylesheet" href="boxicons.css">
    <!-- Instrument Serif for the heading, the system sans for
         the copy and labels. Poppins is no longer used on this page. -->
    <link rel="stylesheet" href="fonts.css">
</head>
<!-- .ink opts this page into the shared redesign in ink.css. -->
<body class="ink">
    <main class="reset-main">
        <div class="reset-page">
            <!-- role="status" because JavaScript replaces this card's contents
                 with the outcome -- verified, expired, reset. The swap is
                 the entire feedback this page gives, and unannounced it is
                 a page that silently becomes a different page. -->
            <div class="reset-card" id="resetCard" role="status">
                <!-- Populated by reset-password.js once it knows whether the
                     token in the URL is even present -- there is nothing
                     useful to show a blank form for if it is missing. -->
            </div>

            <p class="reset-footer">
                <a href="index.html">PartnerPortal</a> &mdash; partnerships where both sides bring something.
            </p>
        </div>
    </main>

    <script src="base.js"></script>

    <script src="password-field.js"></script>
    <script src="reset-password.js"></script>
</body>
</html>
