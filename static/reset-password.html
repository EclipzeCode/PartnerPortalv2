<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Warm the connections to the two third-party origins every page uses,
         before the local stylesheets below start downloading. Both the
         boxicons stylesheet and the font stylesheet are render-blocking
         and are discovered late, at the bottom of this head -- so without
         these the browser pays a DNS lookup plus a TLS handshake to each
         before it can even ask for them. gstatic serves the font files
         themselves and is fetched in CORS mode, which is what crossorigin
         matches; the other two are ordinary stylesheet requests. -->
    <link rel="preconnect" href="https://unpkg.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>Reset password | PartnerPortal</title>
    <!-- SVG first for anything modern (one file, sharp at every size); the
         .ico is the legacy fallback and is also what a bare /favicon.ico
         request gets. -->
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <!-- Public page: reached from an emailed link, no session guaranteed. -->
    <meta name="robots" content="noindex, nofollow">
    <!-- Applied before the first stylesheet so the page never paints in one
         theme and then switches. Light is the default: only an explicit
         choice, stored by the toggle in Settings, turns this on -- the system
         preference is deliberately not consulted, because the product ships
         light and a dark OS is not the same thing as asking for a dark app. -->
    <script>
      try {
        if (localStorage.getItem('partnerPortalTheme') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) { /* storage disabled; light theme is the right fallback */ }
    </script>
    <!-- The redesign's shared layer, then the stylesheet the six
         single-purpose pages share. This page used to load its own copy of
         that second file; see the header of notice.css. -->
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="ink.css">
    <link rel="stylesheet" href="notice.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Instrument Serif for the heading, Space Grotesk for the copy,
         JetBrains Mono for labels. Poppins is no longer used on this page. -->
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<!-- .ink opts this page into the shared redesign in ink.css. -->
<body class="ink">
    <main class="reset-main">
        <div class="reset-page">
            <div class="reset-card" id="resetCard">
                <!-- Populated by reset-password.js once it knows whether the
                     token in the URL is even present -- there is nothing
                     useful to show a blank form for if it is missing. -->
            </div>

            <p class="reset-footer">
                <a href="index.html">PartnerPortal</a> &mdash; partnerships where both sides bring something.
            </p>
        </div>
    </main>

    <script src="reset-password.js"></script>
</body>
</html>
