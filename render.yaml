# Render blueprint. With this committed, Render can configure the service from
# the repo instead of you filling in fields by hand.
#
# DATABASE_URL and SECRET_KEY are deliberately NOT set here -- this file is
# public. Both are marked sync:false, which makes Render prompt for them once
# and store them as secrets.

services:
  - type: web
    name: partnerportal
    runtime: python
    plan: free
    region: ohio          # closest to the Neon project (aws-us-east-2)

    # Migrations run in the build step, not a separate pre-deploy step: the
    # free tier does not support preDeployCommand. DATABASE_URL is available
    # during the build, so `alembic upgrade head` connects to Neon and brings
    # the schema up to date before the new version starts. It is a no-op when
    # there is nothing new to apply.
    buildCommand: pip install -r requirements.txt && alembic upgrade head

    # Two workers is plenty at this scale. `--timeout 120` covers Neon waking
    # from scale-to-zero on the first request after an idle period.
    startCommand: gunicorn app:app --workers 2 --timeout 120 --access-logfile -

    healthCheckPath: /api/categories

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.15"
      # Makes the session cookie HTTPS-only. Render terminates TLS, so this is
      # safe here and would break local development over plain HTTP.
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false

      # Every link this app mails out is built from APP_BASE_URL. Unset, it
      # falls back to http://127.0.0.1:5001 -- so verification links, password
      # resets and proposal notifications all go out pointing at the
      # recipient's own machine, and none of them work. Declared here so it is
      # part of the blueprint rather than something to remember.
      - key: APP_BASE_URL
        value: https://partnerportal-j6x1.onrender.com

      # Outbound mail. Without RESEND_API_KEY the app logs what it would have
      # sent instead of sending it, which is the right behavior locally and
      # the wrong one here: nobody is told a proposal is waiting. sync:false
      # so the key is entered once and stored as a secret.
      - key: RESEND_API_KEY
        sync: false
      # Must be a verified sender at resend.com/domains. Until a domain is
      # verified, Resend's sandbox sender only delivers to the address that
      # owns the Resend account -- which is why REQUIRE_EMAIL_VERIFICATION
      # below stays off.
      - key: EMAIL_FROM
        value: PartnerPortal <onboarding@resend.dev>
      # Where the homepage contact form is delivered. Unset, those messages
      # are written to the logs rather than sent anywhere.
      - key: CONTACT_EMAIL
        sync: false

      # Turn on once EMAIL_FROM is a verified domain and verification mail
      # actually reaches people. Enforcing before that does not stop spam, it
      # stops signups -- see the note in app.py.
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
